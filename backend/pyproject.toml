[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerdna-backend"
version = "1.0.0"
description = "CareerDNA AI – FastAPI Backend Gateway"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",

    # Data Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",

    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",

    # LangGraph / LangChain
    "langgraph>=0.1.14",
    "langchain-core>=0.2.0",
    "langchain-aws>=0.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
